name: Crawl and publish index

on:
  schedule:
    # 03:17 UTC daily -- off the hour so it does not pile onto GitHub's busiest minute.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Repositories to scan in this run"
        required: false
        default: "400"
      force:
        description: "Rescan repositories even if nothing changed"
        type: boolean
        required: false
        default: false

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Home Assistant's dev branch tracks the newest CPython syntax
          # (2026.9 dev already uses PEP 758 `except A, B:`), so the rule
          # extractor needs an interpreter at least as new as core's.
          python-version: "3.14"

      - name: Cache the Home Assistant core tarball
        uses: actions/cache@v6
        with:
          path: .cache
          key: core-dev-${{ github.run_id }}
          restore-keys: core-dev-

      - name: Refresh the core tarball
        run: rm -f .cache/core-dev.tar.gz

      - name: Extract rules from Home Assistant core
        run: python tools/extract_rules.py

      - name: Merge blog and hand-curated rules
        run: python tools/blog_rules.py

      - name: Fetch the HACS catalogue
        run: python tools/catalog.py

      - name: Scan a slice of the catalogue
        # The token is only used to ask whether a deprecation is already
        # reported on the repositories this slice found problems in.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/scan.py \
            --limit "${{ github.event.inputs.limit || '400' }}" \
            --no-tarball-cache \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Build the public index
        run: python tools/build_index.py

      - name: Run the test suite against the fresh data
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest

      - name: Commit the refreshed index and crawl state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/findings.json \
                  state/crawl.json state/feed.json \
                  docs/index.json docs/index.html docs/feed.xml docs/feed.xsl \
                  docs/.nojekyll

          # The rule set is rebuilt every run, so its provenance stamps move
          # daily even when no rule did. Committing that keeps the file in
          # conflict with every open pull request that touches it, and GitHub
          # skips pull_request workflows on a conflicted PR -- the checks do
          # not fail, they never run. The published index carries the rules
          # either way.
          if python tools/rules_changed.py; then
            git add data/rules.json
          else
            git checkout -- data/rules.json
          fi
          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi
          SCANNED=$(python -c "import json;print(json.load(open('docs/index.json'))['coverage']['repos_scanned'])")
          AFFECTED=$(python -c "import json;print(json.load(open('docs/index.json'))['coverage']['repos_affected'])")
          git commit -m "chore(crawl): refresh index (${SCANNED} scanned, ${AFFECTED} affected)"

          # A slice takes about ten minutes, so main can move while it runs.
          # These files are generated, not authored, so the run's own side is
          # always the right answer for them, and rebase calls that side
          # theirs: ours is the branch being replayed onto, origin/main.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto the updated main"
            git fetch origin main
            git rebase -X theirs origin/main || {
              git rebase --abort
              echo "could not rebase cleanly; leaving main alone"
              exit 1
            }
          done
          echo "still could not push after three attempts"
          exit 1

      - name: Save the crawl progress if the run did not finish
        # The scan writes its progress to disk every 25 repositories, and the
        # lookups are the slow part of it: up to 400 of them, 2.1 seconds
        # apart. Without this a crash, the cancel button or the job timeout
        # throws all of that away with the workspace and the next run spends
        # the rate limit on the same repositories again. always() rather than
        # cancelled() because a timeout is not documented as either. After a
        # run that finished there is nothing left uncommitted and this does
        # nothing. Progress files only: the index is rebuilt after the scan,
        # so publishing stays the business of a run that got that far.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/findings.json state/crawl.json
          # Whatever else the run had rewritten by then -- the rule stamps, a
          # half-built index -- is not being committed, and rebasing needs the
          # working tree clean.
          git checkout -- .
          if ! git diff --cached --quiet; then
            git commit -m "chore(crawl): save progress from a cancelled run"
          fi
          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "No progress to save."
            exit 0
          fi
          git rebase -X theirs origin/main
          git push
